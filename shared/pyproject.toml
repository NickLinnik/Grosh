[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grosh-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "PyJWT>=2.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/grosh_shared"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
