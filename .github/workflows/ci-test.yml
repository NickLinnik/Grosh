name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # API tests need a real Postgres because the integration suite hits the
  # database via asyncpg. We spin up a Postgres service container, run
  # migrations, then execute the full pytest suite (unit + integration).
  test-api:
    name: Test Python (api)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://grosh_admin:ci-password@localhost:5432/grosh
      DATABASE_URL_ADMIN: postgresql+asyncpg://grosh_admin:ci-password@localhost:5432/grosh
      JWT_SECRET: ci-jwt-secret-padded-to-32-chars-minimum
      ADMIN_EMAIL: admin@grosh.dev
      ADMIN_PASSWORD: ci-admin-password
      GROSH_API_DB_PASSWORD: ci-api-password
      GROSH_INGESTION_DB_PASSWORD: ci-ingestion-password
      GROSH_CONSUMER_DB_PASSWORD: ci-consumer-password
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (pgvector + pg_cron)
        run: |
          docker build -t grosh-postgres infra/postgres
          docker run -d --name grosh-pg \
            -e POSTGRES_USER=grosh_admin \
            -e POSTGRES_PASSWORD=ci-password \
            -e POSTGRES_DB=grosh \
            -p 5432:5432 \
            grosh-postgres \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=grosh
          timeout 30 bash -c 'until docker exec grosh-pg pg_isready -U grosh_admin -d grosh; do sleep 1; done'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - name: Run migrations
        working-directory: services/api
        run: uv run alembic -c alembic.ini upgrade head
      - name: Pytest
        working-directory: services/api
        run: uv run pytest

  # Consumer and ml don't have tests yet and don't need Postgres. Skip
  # gracefully if a tests/ directory is absent so the matrix entry passes.
  test-other-python:
    name: Test Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [consumer, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - name: Pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then uv run pytest; else echo "No tests/ yet, skipping."; fi

  check-openapi:
    name: Verify OpenAPI completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - name: Verify OpenAPI completeness
        run: uv run python scripts/check_openapi_completeness.py

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: services/frontend
        run: npm ci
      - working-directory: services/frontend
        run: npm test -- --passWithNoTests
