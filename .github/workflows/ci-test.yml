name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # API tests need a real Postgres because the integration suite hits the
  # database via asyncpg. We spin up a Postgres service container, run
  # migrations, then execute the full pytest suite (unit + integration).
  test-api:
    name: Test Python (api)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://grosh_admin:ci-password@localhost:5432/grosh
      DATABASE_URL_ADMIN: postgresql+asyncpg://grosh_admin:ci-password@localhost:5432/grosh
      JWT_SECRET: ci-jwt-secret-padded-to-32-chars-minimum
      ADMIN_EMAIL: admin@grosh.dev
      ADMIN_PASSWORD: ci-admin-password
      GROSH_API_DB_PASSWORD: ci-api-password
      GROSH_INGESTION_DB_PASSWORD: ci-ingestion-password
      GROSH_CONSUMER_DB_PASSWORD: ci-consumer-password
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (pgvector + pg_cron)
        run: |
          docker build -t grosh-postgres infra/postgres
          docker run -d --name grosh-pg \
            -e POSTGRES_USER=grosh_admin \
            -e POSTGRES_PASSWORD=ci-password \
            -e POSTGRES_DB=grosh \
            -p 5432:5432 \
            grosh-postgres \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=grosh
          timeout 30 bash -c 'until docker exec grosh-pg pg_isready -U grosh_admin -d grosh; do sleep 1; done'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - name: Run migrations
        working-directory: shared
        run: uv run alembic -c alembic.ini upgrade head
      - name: Pytest
        working-directory: services/api
        run: uv run pytest

  # normalization, enrichment, e2e, and ml tests.
  # normalization and enrichment have integration tests requiring Postgres.
  # e2e has cross-service integration tests (reprocess + carve-out + RLS invariants).
  # Skip gracefully if a tests/ directory is absent.
  test-other-python:
    name: Test Python (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: normalization, dir: services/normalization }
          - { name: enrichment,    dir: services/enrichment }
          - { name: e2e,           dir: tests/e2e }
          - { name: ml,            dir: services/ml }
    env:
      DATABASE_URL: postgresql://grosh_admin:ci-password@localhost:5432/grosh
      DATABASE_URL_ADMIN: postgresql+asyncpg://grosh_admin:ci-password@localhost:5432/grosh
      # Required by the seed migration (0002_seed.py). Matches the api job.
      ADMIN_EMAIL: admin@grosh.dev
      ADMIN_PASSWORD: ci-admin-password
      GROSH_API_DB_PASSWORD: ci-api-password
      GROSH_INGESTION_DB_PASSWORD: ci-ingestion-password
      GROSH_CONSUMER_DB_PASSWORD: ci-consumer-password
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (pgvector + pg_cron)
        run: |
          docker build -t grosh-postgres infra/postgres
          docker run -d --name grosh-pg \
            -e POSTGRES_USER=grosh_admin \
            -e POSTGRES_PASSWORD=ci-password \
            -e POSTGRES_DB=grosh \
            -p 5432:5432 \
            grosh-postgres \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=grosh
          timeout 30 bash -c 'until docker exec grosh-pg pg_isready -U grosh_admin -d grosh; do sleep 1; done'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - name: Run migrations
        working-directory: shared
        run: uv run alembic -c alembic.ini upgrade head
      - name: Pytest
        working-directory: ${{ matrix.target.dir }}
        run: |
          if [ "${{ matrix.target.name }}" = "e2e" ]; then
            # Full-stack e2e tests need the running app containers + Redpanda;
            # they live at tests/e2e/test_*.py and run in a dedicated job
            # (see ci-e2e.yml). Here we only run integration + unit which work
            # with just Postgres.
            uv run pytest integration unit
          elif [ -d tests ] || [ -d integration ] || [ -d unit ]; then
            uv run pytest
          else
            echo "No tests/ yet, skipping."
          fi

  check-openapi:
    name: Verify OpenAPI completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - name: Verify OpenAPI completeness
        run: uv run python scripts/check_openapi_completeness.py

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: services/frontend
        run: npm ci
      - working-directory: services/frontend
        run: npm test -- --passWithNoTests
