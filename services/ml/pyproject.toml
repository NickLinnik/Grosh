[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grosh-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "prophet>=1.1",
    "pgvector>=0.3",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "grosh-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupyter>=1.0",
]

[tool.uv.sources]
grosh-shared = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/grosh_ml"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
