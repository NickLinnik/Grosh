[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grosh-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.7",
    "asyncpg>=0.29",
    "confluent-kafka>=2.4",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    # alembic + sqlalchemy come via the [migrations] extra on grosh-shared;
    # this image runs `alembic upgrade head` against shared/alembic.ini on
    # dev boot and in CI.
    "grosh-shared[migrations]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
grosh-shared = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/grosh_api"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# SQL queries in repos contain long column expressions that cannot be meaningfully split.
"**/repositories/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
