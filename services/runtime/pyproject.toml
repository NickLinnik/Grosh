[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grosh-runtime"
version = "0.1.0"
description = "Cross-service integration tests for the normalizer + pipeline split (Slice 28). Not a deployable package — exists so `uv run pytest services/runtime/tests` has the same dependency closure as the normalizer + pipeline services it exercises."
requires-python = ">=3.12"
dependencies = [
    "grosh-normalizer",
    "grosh-pipeline",
    "grosh-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
grosh-shared = { workspace = true }
grosh-normalizer = { workspace = true }
grosh-pipeline = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

# No wheel build — this project is tests-only. Tell hatch to build an empty
# wheel so `uv sync` succeeds. We don't ship this anywhere.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
