services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - grosh_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - grosh_net

  api:
    build:
      context: ../services/api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - timescaledb
      - redpanda
    networks:
      - grosh_net

  consumer:
    build:
      context: ../services/consumer
    env_file: .env
    depends_on:
      - timescaledb
      - redpanda
    networks:
      - grosh_net

  frontend:
    build:
      context: ../services/frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - grosh_net

  ml:
    build:
      context: ../services/ml
    env_file: .env
    depends_on:
      - timescaledb
      - redpanda
    networks:
      - grosh_net

volumes:
  timescaledb_data:
  redpanda_data:

networks:
  grosh_net:
    driver: bridge
