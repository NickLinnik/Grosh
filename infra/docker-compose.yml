services:
  postgres:
    build:
      context: ./postgres
    restart: unless-stopped
    command: >
      postgres
        -c shared_preload_libraries=pg_cron,pg_stat_statements
        -c cron.database_name=grosh
        -c pg_stat_statements.track=all
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092,k8s://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092,k8s://host.docker.internal:29092
    ports:
      - "9092:9092"
      - "19092:19092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9644/v1/node_config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_API}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingestion:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_INGESTION}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  normalizer:
    image: grosh-consumer:latest
    build:
      context: ..
      dockerfile: services/runtime/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "grosh_normalizer.main"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_CONSUMER}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy-normalization"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Eventually consistent on normalizer: pipeline consumes normalized_transactions,
  # which normalizer produces. If pipeline starts first it will idle on an empty
  # topic until normalizer catches up — that's correct steady-state behaviour, not
  # a startup ordering bug. Compose does not (and need not) express this runtime
  # dependency in depends_on.
  pipeline:
    image: grosh-consumer:latest
    build:
      context: ..
      dockerfile: services/runtime/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "grosh_pipeline.main"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_CONSUMER}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy-pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../services/frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ml:
    build:
      context: ..
      dockerfile: services/ml/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - grosh_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redpanda_data:

networks:
  grosh_net:
    driver: bridge
