services:
  api:
    command: uvicorn grosh_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../services/api/src:/app/src:ro
      - ../services/api/migrations:/app/migrations:ro

  frontend:
    build:
      context: ../services/frontend
      target: dev
    volumes:
      - ../services/frontend/src:/app/src
      - ../services/frontend/next.config.js:/app/next.config.js:ro

  ingestion:
    command: uvicorn grosh_ingestion.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ../services/ingestion/src:/app/src:ro
      - ./kubeconfig.docker:/root/.kube/config:ro

  normalizer:
    command: >
      python -m watchfiles --filter python
      "python -m grosh_normalizer.main"
      /app/normalizer/src /app/pipeline/src
    environment:
      PYTHONPATH: /app/normalizer/src:/app/pipeline/src
    volumes:
      - ../services/normalizer/src:/app/normalizer/src
      - ../services/pipeline/src:/app/pipeline/src

  pipeline:
    command: >
      python -m watchfiles --filter python
      "python -m grosh_pipeline.main"
      /app/normalizer/src /app/pipeline/src
    environment:
      PYTHONPATH: /app/normalizer/src:/app/pipeline/src
    volumes:
      - ../services/normalizer/src:/app/normalizer/src
      - ../services/pipeline/src:/app/pipeline/src

  ml:
    command: python -m watchfiles --filter python "python -m grosh_ml.main" src/
    volumes:
      - ../services/ml/src:/app/src

  # Local HTTPS reverse proxy. Terminates TLS with mkcert-issued certs
  # and routes `/api/*` to the FastAPI container and everything else to
  # the Next.js container — mirroring the production Caddy setup.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - api
      - ingestion
      - frontend
    networks:
      - grosh_net

  ngrok:
    image: ngrok/ngrok:latest
    command: http ingestion:8001 --url=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - ingestion
    networks:
      - grosh_net
