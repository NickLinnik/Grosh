apiVersion: batch/v1
kind: Job
metadata:
  name: rates-backfill-PLACEHOLDER
  namespace: grosh
  labels:
    app: grosh-rates-backfill
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 3600
  template:
    spec:
      serviceAccountName: grosh-ingestion
      restartPolicy: Never
      containers:
        - name: backfill
          image: PLACEHOLDER_IMAGE
          command: ["python", "-m", "grosh_ingestion.jobs.run_rates_backfill"]
          envFrom:
            - secretRef:
                name: grosh-secrets
          env:
            - name: BACKFILL_SOURCE
              value: PLACEHOLDER_SOURCE
            - name: BACKFILL_FROM_DATE
              value: PLACEHOLDER_FROM_DATE
            - name: BACKFILL_TO_DATE
              value: PLACEHOLDER_TO_DATE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
