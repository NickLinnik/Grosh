# Reprocess job — replays stored transactions through the full pipeline.
#
# Each run: snapshots → deletes → re-publishes to normalized_transactions →
# waits for pipeline consumer → verifies → releases advisory lock + NOTIFY.
# On verification failure: restores from snapshot, releases lock, raises.
#
# Spawned at runtime by the ingestion service's ReprocessDispatcher. This file
# is the operator-side reference for batch invocations only — the runtime
# constructs the same V1Job programmatically.
#
# USER_IDS_JSON must be a valid JSON array of UUID strings.
# Omit the env var (or leave it unset) to reprocess ALL users in the DB.
#
# Usage
# -----
# Reprocess all users:
#   kubectl apply -f reprocess-job-template.yaml
#
# Reprocess specific users:
#   USER_IDS_JSON='["uuid-1","uuid-2"]' envsubst < reprocess-job-template.yaml | kubectl apply -f -
#
# View logs:
#   kubectl logs -n grosh -l app=grosh-reprocess --tail=200 -f
#
# Clean up completed jobs before re-running:
#   kubectl delete jobs -n grosh -l app=grosh-reprocess
#
# Image build (Docker Desktop k8s — containerd does NOT share images with the Docker CLI):
#   docker compose -p grosh -f infra/docker-compose.yml build runtime
#   docker save grosh-consumer:latest | \
#     docker exec -i desktop-control-plane ctr -n k8s.io images import --all-platforms -
#   kubectl delete jobs -n grosh -l app=grosh-reprocess
#
# Or just run `make dev-k8s-setup`, which does the build + import + tag for both
# ingestion and consumer images and provisions the K8s namespace + secrets.
#
# backoffLimit: 0 — reprocess must not auto-retry on failure. A failed run
# means verification failed or an unexpected error occurred; both require a human
# to inspect logs and the reprocessing_backups snapshot before re-running.
#
# ttlSecondsAfterFinished: 86400 — keep the completed Job (and its pod logs)
# for 24 hours so failures can be investigated before automatic cleanup.
#
# activeDeadlineSeconds: 7200 — 2-hour hard cap. The reprocess job polls for
# pipeline catchup (_CATCHUP_TIMEOUT_S = 300s per user), but for very large
# datasets or slow pipelines this deadline prevents a hung job from blocking
# the advisory lock indefinitely.

apiVersion: batch/v1
kind: Job
metadata:
  name: grosh-reprocess
  namespace: grosh
  labels:
    app: grosh-reprocess
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 7200
  template:
    spec:
      serviceAccountName: grosh-ingestion
      restartPolicy: Never
      containers:
        - name: reprocess
          image: grosh-consumer:latest
          imagePullPolicy: Never
          command: ["python", "-m", "grosh_normalizer.reprocess_main"]
          envFrom:
            - secretRef:
                name: grosh-secrets-consumer
          env:
            - name: USER_IDS_JSON
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
