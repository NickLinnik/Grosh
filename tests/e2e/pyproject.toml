[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grosh-e2e"
version = "0.1.0"
description = "Cross-service end-to-end tests. Not a deployable package — exists so `uv run pytest tests/e2e` has the same dependency closure as the services it exercises (normalization + enrichment + shared)."
requires-python = ">=3.12"
dependencies = [
    "grosh-normalization",
    "grosh-enrichment",
    "grosh-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "confluent-kafka>=2.5",
    "asyncpg>=0.29",
]

[tool.uv.sources]
grosh-shared = { workspace = true }
grosh-normalization = { workspace = true }
grosh-enrichment = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

# No wheel build — this project is tests-only. Tell hatch to build an empty
# wheel so `uv sync` succeeds. We don't ship this anywhere.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["integration", "unit", "services"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
